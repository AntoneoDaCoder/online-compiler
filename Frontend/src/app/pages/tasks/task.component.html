<div class="tasks-page layout">
    <div class="tasks-main">
        <section class="filters card">
            <input placeholder="Фильтр по жетону задачи" [(ngModel)]="filterSlug" (input)="applyFilters()" />
            <select *ngIf="adminOrEditor" [(ngModel)]="showOnlyPublished" (change)="applyFilters()">
                <option value="all">Все</option>
                <option value="published">Опубликованные</option>
                <option value="unpublished">Неопубликованные</option>
            </select>
            <div class="row">
                <button (click)="clearFilters()">Очистить</button>
            </div>
        </section>

        <section class="problems-list">
            <div *ngFor="let p of filtered" class="problem-card">
                <div class="problem-main">
                    <div class="title">{{ p.title }} <small class="slug">({{ p.slug }})</small></div>
                    <div class="langs">
                        <span *ngIf="p.latestVersion">
                            {{ formatSupportedLanguages(p.latestVersion.supportedLanguages) }}
                        </span>
                    </div>
                </div>

                <div class="problem-meta">
                    <div class="actions">
                        <button class="btn-solve" (click)="onOpenProblem(p)">Решить</button>
                        <button *ngIf="isAdminOrEditor()" class="btn-edit" (click)="onEditProblem(p)">Изменить</button>
                        <button *ngIf="isAdminOrEditor()" class="btn-delete" (click)="onDeleteProblem(p)">Запросить удаление</button>
                    </div>
                </div>
            </div>

            <div *ngIf="filtered.length === 0" class="muted small">Нет задач по текущим фильтрам.</div>
        </section>
    </div>

    <app-sidebar class="tasks-sidebar"></app-sidebar>
</div>

<div class="modal-backdrop" *ngIf="deleteDialogOpen" (click)="closeDeleteDialog()"></div>

<div class="delete-modal card" *ngIf="deleteDialogOpen" (click)="$event.stopPropagation()">
    <div class="delete-modal__header">
        <div class="title">Запросить удаление</div>
        <div class="muted small" *ngIf="deleteTarget">
            {{ deleteTarget.title }} ({{ deleteTarget.slug }})
        </div>
    </div>

    <div class="delete-modal__body">
        <label for="deleteReason">Причина запроса</label>
        <textarea
            id="deleteReason"
            [(ngModel)]="deleteReason"
            rows="5"
            placeholder="Опишите причину удаления"
        ></textarea>
    </div>

    <div class="delete-modal__footer row">
        <button class="secondary" (click)="closeDeleteDialog()">Отмена</button>
        <button
            class="btn-primary"
            (click)="confirmDeleteRequest()"
            [disabled]="deleteSubmitting || !deleteReason.trim()"
        >
            Подтвердить
        </button>
    </div>
</div>
