<div class="tasks-page layout">
    <div class="tasks-main">
        <section class="filters">
            <input placeholder="Фильтр по slug" [(ngModel)]="filterSlug" (input)="applyFilters()" />


            <select [(ngModel)]="filterLang" (change)="applyFilters()">
                <option [ngValue]="null">Все языки</option>
                <option *ngFor="let l of languages" [ngValue]="l.id">{{ l.displayName }}</option>
            </select>


            <select [(ngModel)]="showOnlyPublished" (change)="applyFilters()">
                <option value="all">Все</option>
                <option value="published">Опубликованные</option>
                <option value="unpublished">Неопубликованные</option>
            </select>


            <button (click)="clearFilters()">Очистить</button>
            <button (click)="updateData()">Обновить (SignalR)</button>
        </section>


        <section class="problems-list">
            <div *ngFor="let p of filtered" class="problem-card">
                <div class="problem-main">
                    <div class="title">{{ p.title }} <small class="slug">({{ p.slug }})</small></div>
                    <div class="langs">
                        <span *ngIf="p.latestVersion">
                            {{ formatSupportedLanguages(p.latestVersion.supportedLanguages) }}
                        </span>

                    </div>
                </div>


                <div class="problem-meta">
                    <div *ngIf="p.status && (auth.getRoles().includes('Admin') || auth.getRoles().includes('Editor'))"
                        class="status">
                        <span>Статус: {{ p.status }}</span>
                        <span *ngIf="p.reason">Причина: {{ p.reason }}</span>
                    </div>


                    <div class="actions">
                        <button (click)="onOpenProblem(p)">
                            {{ getProblemActionLabel(p) }}
                        </button>

                    </div>
                </div>
            </div>


            <div *ngIf="filtered.length === 0">Нет задач по текущим фильтрам.</div>
        </section>
    </div>


    <app-sidebar class="tasks-sidebar"></app-sidebar>
</div>
