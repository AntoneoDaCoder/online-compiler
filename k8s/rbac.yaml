apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: api-server-role
rules:
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["create", "get", "list", "watch", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-server-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: api-server-sa
  namespace: default
roleRef:
  kind: Role
  name: api-server-role
  apiGroup: rbac.authorization.k8s.io
