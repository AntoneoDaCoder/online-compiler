apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server-sa
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-server-global-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "get"]
- apiGroups: [""]
  resources: ["resourcequotas", "pods", "pods/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-server-global-rolebinding
subjects:
- kind: ServiceAccount
  name: api-server-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: api-server-global-role
  apiGroup: rbac.authorization.k8s.io
